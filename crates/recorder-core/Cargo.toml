[package]
name = "recorder-core"
description = "Core library for the voice_recorder continuous audio recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
directories.workspace = true
tracing.workspace = true
chrono.workspace = true
pipewire = { version = "0.10", features = ["v1_0_0"] }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "net", "io-util"] }
serde_json = "1"
opus = "0.4"
ogg = "0.9"
uuid = { version = "1.26.1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono-tz = "0.10"
zbus = "5"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "rt-multi-thread"] }

[lints]
workspace = true
